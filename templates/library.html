{% extends "base.html" %}
{% block title %}Video Library - STEM Video Generator{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-2xl font-bold">Video Library</h2>
            <p class="text-gray-400 text-sm mt-1">Browse and manage generated videos</p>
        </div>
        <div class="flex gap-2">
            <button hx-post="/videos/clean-all-temp" hx-target="#clean-all-result" hx-swap="innerHTML"
                hx-confirm="Remove temp audio/BGM files for all completed videos? Final videos and thumbnails are kept."
                class="bg-green-500/20 text-green-400 border border-green-500/30 px-4 py-2 rounded-lg hover:bg-green-500/30 transition text-sm">
                Clean All Temp Files
            </button>
            <button id="download-all-btn" onclick="downloadAllCompleted()"
                class="bg-blue-500/20 text-blue-400 border border-blue-500/30 px-4 py-2 rounded-lg hover:bg-blue-500/30 transition text-sm">
                Download All
            </button>
            <a href="/upload" class="bg-accent/20 text-accent border border-accent/30 px-4 py-2 rounded-lg hover:bg-accent/30 transition text-sm">
                + New Video
            </a>
        </div>
    </div>

    <div id="clean-all-result"></div>

    <!-- Filters -->
    <div class="bg-dark-card border border-dark-border rounded-xl p-4">
        <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div>
                <select name="subject" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-sm focus:border-accent/50 focus:outline-none"
                    hx-get="/videos/list" hx-target="#video-grid" hx-include="[name]" hx-trigger="change">
                    <option value="">All Subjects</option>
                    {% for s in subjects %}
                    <option value="{{ s }}" {{ 'selected' if filters.subject == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <select name="difficulty" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-sm focus:border-accent/50 focus:outline-none"
                    hx-get="/videos/list" hx-target="#video-grid" hx-include="[name]" hx-trigger="change">
                    <option value="">All Difficulty</option>
                    <option value="easy" {{ 'selected' if filters.difficulty == 'easy' }}>Easy</option>
                    <option value="medium" {{ 'selected' if filters.difficulty == 'medium' }}>Medium</option>
                    <option value="hard" {{ 'selected' if filters.difficulty == 'hard' }}>Hard</option>
                </select>
            </div>
            <div>
                <select name="status" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-sm focus:border-accent/50 focus:outline-none"
                    hx-get="/videos/list" hx-target="#video-grid" hx-include="[name]" hx-trigger="change">
                    <option value="">All Status</option>
                    <option value="completed" {{ 'selected' if filters.status == 'completed' }}>Completed</option>
                    <option value="processing" {{ 'selected' if filters.status == 'processing' }}>Processing</option>
                    <option value="pending" {{ 'selected' if filters.status == 'pending' }}>Pending</option>
                    <option value="failed" {{ 'selected' if filters.status == 'failed' }}>Failed</option>
                </select>
            </div>
            <div>
                <select name="sort" class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-sm focus:border-accent/50 focus:outline-none"
                    hx-get="/videos/list" hx-target="#video-grid" hx-include="[name]" hx-trigger="change">
                    <option value="newest" {{ 'selected' if filters.sort == 'newest' }}>Newest First</option>
                    <option value="oldest" {{ 'selected' if filters.sort == 'oldest' }}>Oldest First</option>
                    <option value="subject" {{ 'selected' if filters.sort == 'subject' }}>By Subject</option>
                    <option value="duration" {{ 'selected' if filters.sort == 'duration' }}>By Duration</option>
                </select>
            </div>
            <div class="col-span-2">
                <input type="text" name="search" value="{{ filters.search }}" placeholder="Search videos..."
                    class="w-full bg-dark-bg border border-dark-border rounded-lg px-3 py-2 text-sm focus:border-accent/50 focus:outline-none"
                    hx-get="/videos/list" hx-target="#video-grid" hx-include="[name]" hx-trigger="keyup changed delay:300ms">
            </div>
        </div>
    </div>

    <!-- Video Grid -->
    <div id="video-grid">
        {% include "components/video_grid.html" %}
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function downloadAllCompleted() {
    const btn = document.getElementById('download-all-btn');
    btn.disabled = true;
    btn.textContent = 'Fetching...';

    const res = await fetch('/videos/completed-ids');
    const ids = await res.json();

    if (!ids.length) {
        btn.textContent = 'No videos';
        setTimeout(() => { btn.disabled = false; btn.textContent = 'Download All'; }, 2000);
        return;
    }

    btn.textContent = `Downloading 0/${ids.length}`;
    for (let i = 0; i < ids.length; i++) {
        const a = document.createElement('a');
        a.href = `/videos/${ids[i]}/download`;
        a.download = `${ids[i]}.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        btn.textContent = `Downloading ${i + 1}/${ids.length}`;
        await new Promise(r => setTimeout(r, 800));
    }

    // Clear all filters and reset the grid after downloads complete
    document.querySelectorAll('select[name]').forEach(el => el.value = '');
    document.querySelector('input[name="search"]').value = '';
    htmx.trigger(document.querySelector('select[name="subject"]'), 'change');

    btn.textContent = 'Done!';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Download All'; }, 2000);
}
</script>
{% endblock %}
