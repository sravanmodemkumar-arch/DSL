<div class="grid grid-cols-2 md:grid-cols-5 gap-4">
    <div class="bg-dark-card border border-dark-border rounded-xl p-4">
        <p class="text-3xl font-bold text-white">{{ total_videos }}</p>
        <p class="text-xs text-gray-500 mt-1">Total Videos</p>
    </div>
    <div class="bg-dark-card border border-dark-border rounded-xl p-4">
        <p class="text-3xl font-bold text-green-400">{{ completed }}</p>
        <p class="text-xs text-gray-500 mt-1">Completed</p>
    </div>
    <div class="bg-dark-card border border-dark-border rounded-xl p-4">
        <p class="text-3xl font-bold text-cyan-400">{{ processing }}</p>
        <p class="text-xs text-gray-500 mt-1">Processing</p>
    </div>
    <div class="bg-dark-card border border-dark-border rounded-xl p-4">
        <p class="text-3xl font-bold text-yellow-400">{{ pending }}</p>
        <p class="text-xs text-gray-500 mt-1">Pending</p>
    </div>
    <div class="bg-dark-card border border-dark-border rounded-xl p-4">
        <p class="text-3xl font-bold text-red-400">{{ failed }}</p>
        <p class="text-xs text-gray-500 mt-1">Failed</p>
    </div>
</div>
